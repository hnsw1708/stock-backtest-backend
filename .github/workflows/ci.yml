name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify
        run: mvn -q -e verify

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
